<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 290" width="900" height="290" role="img" aria-label="You draw an area. The browser fetches the open aerial photo tiles for that country from the imagery servers, finds candidate shapes by colour, scores each with a model in web workers and lists the pools with outline, area and size. There is no backend and nothing is sent back.">
